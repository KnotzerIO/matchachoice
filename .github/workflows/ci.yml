name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (saves minutes on rapid pushes)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Turbo remote cache (optional): set these repo secrets/vars to enable.
      # Without them, Turbo just runs locally — the job still works.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & format
        run: pnpm check

      - name: Typecheck
        run: pnpm check-types

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # env is validated at runtime, not build time — skip the t3-env check
          # so CI doesn't need real secrets to verify the build compiles.
          SKIP_ENV_VALIDATION: "1"
